<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Higher or Lower - Fútbol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="video-fondo" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="videos/videofutbol.mp4" type="video/mp4">
    </video>

    <div id="contenido">
        <div id="pantalla-login">
            <h1>WHO HAS MORE? ⚽</h1>
            <input type="text" id="login-nombre" placeholder="Nombre de usuario">
            <div class="login-password-field">
                <input type="password" id="login-password" placeholder="Contraseña">
                <button class="password-visibility-toggle" id="btn-toggle-login-password" type="button" aria-label="Mostrar contraseña" aria-controls="login-password">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"></path>
                        <circle cx="12" cy="12" r="2.7"></circle>
                        <path class="password-eye-slash" d="m4 4 16 16"></path>
                    </svg>
                </button>
            </div>
            <button id="btn-login">Iniciar sesión</button>
            <p><a href="#" id="link-ir-registro">¿No tienes cuenta? Regístrate</a></p>
            <p id="mensaje-error"></p>
        </div>

        <div id="pantalla-registro" style="display: none;">
            <h1>Crear cuenta</h1>
            <input type="text" id="registro-nombre" placeholder="Nombre de usuario">
            <input type="password" id="registro-password" placeholder="Contraseña">
            <input type="password" id="registro-password-confirmar" placeholder="Confirmar contraseña">
            <button id="btn-registro">Registrarse</button>
            <p><a href="#" id="link-ir-login">¿Ya tienes cuenta? Inicia sesión</a></p>
            <p id="mensaje-error-registro"></p>
        </div>

        <div id="pantalla-categoria" style="display: none;">
            <h2>Elige una categoría</h2>
            <button id="btn-ver-ranking">Ver ranking</button>
            <button id="btn-volver-login">← Volver</button>
            <button class="btn-categoria" data-categoria="golesCarrera">Goles en la carrera</button>
            <button class="btn-categoria" data-categoria="golesTemporada">Goles temporada 24/25</button>
            <button class="btn-categoria" data-categoria="golesSeleccion">Goles en Selección temporada 24/25</button>
        </div>

        <div id="pantalla-ranking" style="display: none;">
            <div class="ranking-watermarks ranking-watermarks--clubs" aria-hidden="true">
                <img src="https://media.api-sports.io/football/teams/42.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/541.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/496.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/157.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/85.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/40.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/529.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/505.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/165.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/81.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/49.png" alt="" loading="lazy" decoding="async">
            </div>
            <div class="ranking-watermarks ranking-watermarks--national" aria-hidden="true">
                <img src="https://media.api-sports.io/football/teams/2.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/26.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/6.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/9.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/10.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/25.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/1.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/3.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/7.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/8.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/12.png" alt="" loading="lazy" decoding="async">
                <img src="https://media.api-sports.io/football/teams/27.png" alt="" loading="lazy" decoding="async">
            </div>
            <h2>RANKING</h2>
            <div id="ranking-controles">
                <button id="btn-ranking-anterior" type="button" aria-label="Categoría anterior">←</button>
                <strong id="ranking-categoria"></strong>
                <button id="btn-ranking-siguiente" type="button" aria-label="Categoría siguiente">→</button>
            </div>
            <ul id="lista-ranking"></ul>
            <button id="btn-volver-ranking">← Volver</button>
        </div>

        <div id="pantalla-juego" style="display: none;">
            <h2>¿Quién tiene más goles en la 24/25?</h2>
            <div id="temporizador-contenedor">
                <p id="temporizador-visual" aria-live="off">10.0 s</p>
                <div id="temporizador-barra" role="progressbar" aria-label="Tiempo restante" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10">
                    <span></span>
                </div>
            </div>
            <button id="btn-jugador1"></button>
            <button id="btn-jugador2"></button>
            <p id="mensaje-resultado"></p>
            <p id="racha-visual">RACHA: 0</p>
            <p id="record-visual">RÉCORD: 0</p>
            <button id="btn-volver-categoria">← Cambiar categoría</button>
        </div>
    </div>

    <script src="script.js?v=5"></script>
</body>
</html>
