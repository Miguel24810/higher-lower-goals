spring.application.name=higher-lower-game

# Puerto del servidor web; la conexion MySQL mantiene el 3306.
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/higher_lower_futbol}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

api.football.key=${API_FOOTBALL_KEY}
admin.sync.key=${ADMIN_SYNC_KEY}
jwt.secret=${JWT_SECRET}