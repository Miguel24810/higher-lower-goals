version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: higher_lower_futbol
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/higher_lower_futbol
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      ADMIN_SYNC_KEY: ${ADMIN_SYNC_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mysql

volumes:
  mysql_data: